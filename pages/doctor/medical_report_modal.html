<!-- Medical Report Modal for Doctors -->
<div id="medical-report-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[calc(100vh-80px)] overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="sticky top-0 bg-gradient-to-r from-[#00A3AC] to-[#008A96] text-white p-6 flex items-center justify-between">
      <h2 class="text-2xl font-bold">Generate Medical Report</h2>
      <button onclick="closeMedicalReportModal()" class="text-white hover:bg-white hover:bg-opacity-20 p-2 rounded-lg transition">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6 space-y-5 overflow-auto flex-grow">
      <!-- Patient Info (Read-only) -->
      <div class="bg-gray-50 p-4 rounded-lg">
        <h3 class="font-semibold text-gray-700 mb-3">Patient Information</h3>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <p class="text-xs text-gray-600">Patient Name</p>
            <p id="report-patient-name" class="font-semibold text-gray-900"></p>
          </div>
          <div>
            <p class="text-xs text-gray-600">Appointment Date & Time</p>
            <p id="report-apt-datetime" class="font-semibold text-gray-900"></p>
          </div>
          <div>
            <p class="text-xs text-gray-600">Chief Complaint</p>
            <p id="report-chief-complaint" class="font-semibold text-gray-900"></p>
          </div>
        </div>
      </div>

      <!-- Medical Report Form -->
      <form id="medical-report-form" class="space-y-5">
        <input type="hidden" id="report-apt-id" />

        <!-- Symptoms -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Symptoms <span class="text-red-500">*</span>
          </label>
          <textarea
            id="report-symptoms"
            placeholder="e.g., Persistent cough, mild fever, body aches..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#00A3AC] focus:border-transparent outline-none resize-none"
            rows="4"
            required
          ></textarea>
        </div>

        <!-- Diagnosis -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Diagnosis <span class="text-red-500">*</span>
          </label>
          <textarea
            id="report-diagnosis"
            placeholder="e.g., Acute upper respiratory infection..."
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#00A3AC] focus:border-transparent outline-none resize-none"
            rows="4"
            required
          ></textarea>
        </div>

        <!-- Vital Signs Row -->
        <div class="grid grid-cols-2 gap-3">
          <!-- Blood Pressure -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              Blood Pressure
            </label>
            <input
              type="text"
              id="report-bp"
              placeholder="e.g., 120/80"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#00A3AC] focus:border-transparent outline-none"
            />
          </div>

          <!-- Weight -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              Weight (kg)
            </label>
            <input
              type="number"
              id="report-weight"
              placeholder="e.g., 75"
              step="0.1"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#00A3AC] focus:border-transparent outline-none"
            />
          </div>
        </div>

        <!-- Prescribed Medicines -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Prescribed Medicines
          </label>
          <div id="medicines-list" class="space-y-3 mb-3">
            <!-- Medicines will be added dynamically -->
          </div>
          <button
            type="button"
            onclick="addMedicineField()"
            class="flex items-center gap-2 text-[#00A3AC] hover:text-[#008A96] font-semibold transition"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
            Add Medicine
          </button>
        </div>

        <!-- Additional Notes -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Additional Notes
          </label>
          <textarea
            id="report-notes"
            placeholder="Any additional observations or instructions..."
            class="w-full border border-gray-300 rounded-lg px-6 py-4 focus:ring-2 focus:ring-[#00A3AC] focus:border-transparent outline-none resize-none"
            rows="4"
          ></textarea>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="sticky bottom-0 bg-gray-50 border-t border-gray-200 p-4 flex gap-3 justify-end">
      <button
        onclick="closeMedicalReportModal()"
        class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-semibold hover:bg-gray-100 transition"
      >
        Cancel
      </button>
      <button
        onclick="saveMedicalReport()"
        class="px-4 py-2 bg-gradient-to-r from-[#00A3AC] to-[#008A96] text-white rounded-lg font-semibold hover:shadow-lg transition"
      >
        <i data-lucide="save" class="w-4 h-4 inline mr-2"></i>
        Save Report
      </button>
    </div>
  </div>
</div>

<script>
let medicineFieldCount = 0;
const MEDICAL_REPORT_FORBIDDEN_CHAR_PATTERN = /[-*&]/g;

function stripForbiddenMedicalReportChars(value) {
  return (value || '').replace(MEDICAL_REPORT_FORBIDDEN_CHAR_PATTERN, '');
}

function bindForbiddenCharFilter(element) {
  if (!element || element.dataset.forbiddenFilterBound === 'true') {
    return;
  }

  element.dataset.forbiddenFilterBound = 'true';
  element.addEventListener('input', () => {
    const cleanedValue = stripForbiddenMedicalReportChars(element.value);
    if (cleanedValue !== element.value) {
      element.value = cleanedValue;
    }
  });
}

function bindMedicalReportFieldFilters() {
  ['report-symptoms', 'report-diagnosis', 'report-notes'].forEach((id) => {
    bindForbiddenCharFilter(document.getElementById(id));
  });

  document.querySelectorAll('.medicine-name, .medicine-dosage, .medicine-frequency').forEach(bindForbiddenCharFilter);
}

function openMedicalReportModal(appointmentData) {
  // Populate patient info
  document.getElementById('report-apt-id').value = appointmentData.appointment_id;
  document.getElementById('report-patient-name').textContent = appointmentData.patient_name;
  document.getElementById('report-apt-datetime').textContent = 
    new Date(appointmentData.app_date + ' ' + appointmentData.appointment_time).toLocaleString();
  document.getElementById('report-chief-complaint').textContent = appointmentData.reason_for_visit;

  // Clear form
  document.getElementById('medical-report-form').reset();
  document.getElementById('medicines-list').innerHTML = '';
  medicineFieldCount = 0;
  bindMedicalReportFieldFilters();

  // Check if report already exists
  loadExistingReport(appointmentData.appointment_id);

  // Show modal
  document.getElementById('medical-report-modal').classList.remove('hidden');
}

function closeMedicalReportModal() {
  document.getElementById('medical-report-modal').classList.add('hidden');
}

function addMedicineField() {
  medicineFieldCount++;
  const medicinesList = document.getElementById('medicines-list');
  const medicineDiv = document.createElement('div');
  medicineDiv.className = 'flex gap-2 medicine-field';
  medicineDiv.id = `medicine-${medicineFieldCount}`;
  medicineDiv.innerHTML = `
    <input
      type="text"
      placeholder="Medicine name"
      class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00A3AC] outline-none medicine-name"
    />
    <input
      type="text"
      placeholder="Dosage (e.g., 500mg)"
      class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00A3AC] outline-none medicine-dosage"
    />
    <input
      type="text"
      placeholder="Frequency (e.g., 2x daily)"
      class="w-28 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00A3AC] outline-none medicine-frequency"
    />
    <button
      type="button"
      onclick="removeMedicineField('medicine-${medicineFieldCount}')"
      class="text-red-500 hover:text-red-700 transition"
    >
      <i data-lucide="trash-2" class="w-4 h-4"></i>
    </button>
  `;
  medicinesList.appendChild(medicineDiv);
  bindForbiddenCharFilter(medicineDiv.querySelector('.medicine-name'));
  bindForbiddenCharFilter(medicineDiv.querySelector('.medicine-dosage'));
  bindForbiddenCharFilter(medicineDiv.querySelector('.medicine-frequency'));
  lucide.createIcons();
}

function removeMedicineField(id) {
  const field = document.getElementById(id);
  if (field) {
    field.remove();
  }
}

async function loadExistingReport(appointmentId) {
  try {
    const response = await fetch(
      `../../api/doctor/medical_report.php?appointment_id=${appointmentId}`,
      { credentials: 'include' }
    );
    const result = await response.json();

    if (result.status === 'success' && result.data) {
      const report = result.data;
      document.getElementById('report-symptoms').value = stripForbiddenMedicalReportChars(report.symptoms || '');
      document.getElementById('report-diagnosis').value = stripForbiddenMedicalReportChars(report.diagnosis || '');
      document.getElementById('report-bp').value = report.blood_pressure || '';
      document.getElementById('report-weight').value = report.weight || '';
      document.getElementById('report-notes').value = stripForbiddenMedicalReportChars(report.additional_notes || '');

      // Load medicines
      if (report.prescribed_medicines && Array.isArray(report.prescribed_medicines)) {
        report.prescribed_medicines.forEach(medicine => {
          addMedicineField();
          const lastIndex = medicineFieldCount;
          document.querySelector(`#medicine-${lastIndex} .medicine-name`).value = stripForbiddenMedicalReportChars(medicine.name || '');
          document.querySelector(`#medicine-${lastIndex} .medicine-dosage`).value = stripForbiddenMedicalReportChars(medicine.dosage || '');
          document.querySelector(`#medicine-${lastIndex} .medicine-frequency`).value = stripForbiddenMedicalReportChars(medicine.frequency || '');
        });
      }
    }
  } catch (error) {
    console.error('Error loading existing report:', error);
  }
}

async function saveMedicalReport() {
  const appointmentId = document.getElementById('report-apt-id').value;
  const symptoms = stripForbiddenMedicalReportChars(document.getElementById('report-symptoms').value.trim());
  const diagnosis = stripForbiddenMedicalReportChars(document.getElementById('report-diagnosis').value.trim());
  const bloodPressure = document.getElementById('report-bp').value.trim();
  const weight = document.getElementById('report-weight').value.trim();
  const additionalNotes = stripForbiddenMedicalReportChars(document.getElementById('report-notes').value.trim());

  // Validate required fields
  if (!symptoms || !diagnosis) {
    alert('Please fill in Symptoms and Diagnosis');
    return;
  }

  // Collect medicines
  const medicines = [];
  document.querySelectorAll('.medicine-field').forEach(field => {
    const name = stripForbiddenMedicalReportChars(field.querySelector('.medicine-name').value.trim());
    const dosage = stripForbiddenMedicalReportChars(field.querySelector('.medicine-dosage').value.trim());
    const frequency = stripForbiddenMedicalReportChars(field.querySelector('.medicine-frequency').value.trim());
    if (name) {
      medicines.push({ name, dosage, frequency });
    }
  });

  try {
    const response = await fetch('../../api/doctor/medical_report.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        appointment_id: parseInt(appointmentId),
        symptoms,
        diagnosis,
        blood_pressure: bloodPressure,
        weight: weight ? parseFloat(weight) : null,
        prescribed_medicines: medicines,
        additional_notes: additionalNotes
      })
    });

    const result = await response.json();
    if (result.status === 'success') {
      alert('Medical report saved successfully!');
      closeMedicalReportModal();
      // Optionally reload appointments
      if (typeof loadScheduleForDate !== 'undefined') {
        const selectedDate = document.querySelector('[data-selected-date]')?.getAttribute('data-selected-date');
        if (selectedDate) loadScheduleForDate(selectedDate);
      }
    } else {
      alert('Error: ' + result.message);
    }
  } catch (error) {
    alert('Error saving report: ' + error.message);
  }
}
</script>
